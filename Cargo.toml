[package]
name = "spotify-adblock"
version = "1.1.0"
authors = ["abba23"]
description = "Adblocker for Spotify"
license = "GPL-3"
repository = "https://github.com/abba23/spotify-adblock"
readme = "README.md"
edition = "2024"

[package.metadata.deb]
depends = "spotify-client"
enhances = "spotify-client"
assets = [
    ["target/release/libspotifyadblock.so", "usr/local/lib/spotify-adblock.so", "644"],
    ["config.toml", "/etc/spotify-adblock/config.toml", "644"],
    ["spotify-adblock-deb.desktop", "usr/local/share/applications/spotify-adblock-deb.desktop", "644"],
]

[dependencies]
dirs = "*"
env_logger = "*"
libc = "*"
log = "*"
regex = "*"
serde = { version = "*", features = ["derive"] }
serde_regex = "*"
toml = "*"

[lib]
name = "spotifyadblock"
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
